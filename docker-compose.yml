# FileHatch Production Docker Compose
# Uses pre-built images from Docker Hub
#
# Usage:
#   docker compose up -d                    # Start core services
#   docker compose --profile office up -d   # With OnlyOffice
#   docker compose --profile sso up -d      # With Keycloak SSO
#
# For development (with local builds):
#   docker compose -f docker-compose-dev.yaml up -d
#
# Required production credentials and encryption keys must be set in .env.

services:
  # 1. Main Backend (Go)
  api:
    container_name: fh-api
    image: svrforum/filehatch-api:${IMAGE_TAG:?IMAGE_TAG is required for production}
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - FH_ENV=production
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:?DB_USER is required for production}
      - DB_PASS=${DB_PASS:?DB_PASS is required for production}
      - DB_NAME=${DB_NAME:?DB_NAME is required for production}
      - VALKEY_HOST=${VALKEY_HOST:-valkey}
      - VALKEY_PORT=${VALKEY_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required for production}
      # 비워 두면 config 볼륨에 임의 키가 생성되어 보존됩니다.
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-}
      - SMB_ENCRYPTION_KEY=${SMB_ENCRYPTION_KEY:-}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8080}
      - ONLYOFFICE_INTERNAL_URL=${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EXTERNAL_URL=${EXTERNAL_URL:-}
      - RHWP_STUDIO_URL=${RHWP_STUDIO_URL:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${CONFIG_PATH:-./config}:/etc/filehatch
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Frontend (React + Express)
  ui:
    container_name: fh-ui
    image: svrforum/filehatch-ui:${IMAGE_TAG:?IMAGE_TAG is required for production}
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3080}:3000"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - API_URL=http://api:8080
      - ONLYOFFICE_URL=${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-}
      - EXTERNAL_URL=${EXTERNAL_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 3. SMB Service (Sidecar)
  samba:
    container_name: fh-samba
    image: svrforum/filehatch-samba:${IMAGE_TAG:?IMAGE_TAG is required for production}
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - WORKGROUP=${SMB_WORKGROUP:-WORKGROUP}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${CONFIG_PATH:-./config}:/etc/filehatch
      # smb.conf is now managed by the container (entrypoint.sh copies from template)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x smbd > /dev/null && pgrep -x nmbd > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 4. Database (PostgreSQL)
  db:
    container_name: fh-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - POSTGRES_USER=${DB_USER:?DB_USER is required for production}
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS is required for production}
      - POSTGRES_DB=${DB_NAME:?DB_NAME is required for production}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - ${DATABASE_PATH:-./database}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required for production} -d ${DB_NAME:?DB_NAME is required for production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Cache & Queue (Valkey)
  valkey:
    container_name: fh-valkey
    image: valkey/valkey:8.1.5-alpine
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Seoul}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 6. OnlyOffice Document Server (Optional - use: docker compose --profile office up -d)
  onlyoffice:
    container_name: fh-onlyoffice
    image: onlyoffice/documentserver:9.2.1
    restart: unless-stopped
    profiles:
      - office
    ports:
      - "${ONLYOFFICE_PORT:-8088}:80"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
      - USE_UNAUTHORIZED_STORAGE=true
      - WOPI_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 7. Keycloak SSO Server (Optional - use: docker compose --profile sso up -d)
  keycloak:
    container_name: fh-keycloak
    image: quay.io/keycloak/keycloak:26.5.1
    restart: unless-stopped
    profiles:
      - sso
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      # 비활성 profile도 interpolation되므로 필수 검증은 docker-compose-sso.yaml에서 수행합니다.
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-}
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT:-8180}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
    command:
      - start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 1 cat <&3 | grep -q '200\\|UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  onlyoffice_data:
  onlyoffice_log:
  keycloak_data:
